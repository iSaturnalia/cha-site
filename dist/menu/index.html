<!doctype html>
<html lang="ru">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#1b1715">
  <title>Меню — Чайная «Ча»</title>
  <link rel="icon" href="../assets/cha-logo.png">
  <link rel="stylesheet" href="../style.css">

<body class="catalog">
  <a class="skip" href="#main">К содержанию</a>
  <header class="site-header">

      <a class="button button-outline header-book" href="tel:+78512298686">Позвонить</a>

  </header>
  <main id="main">
    <div class="menu-intro wrap">
      <p class="kicker">Чайная «Ча»</p>
      <h1>Меню</h1>
      <form class="search-form" role="search">
        <label for="search">Поиск по меню</label>
        <div class="search-box">
          <input type="search" id="search" name="q" placeholder="Название или ингредиент" autocomplete="off">
          <button type="button" class="clear-search" hidden>Очистить</button>
        </div>
      </form>
    </div>
    <div class="menu-nav">
      <div class="wrap" id="menu-nav-inner">
        <nav class="menu-tabs" aria-label="Разделы меню">
          <a href="?section=kitchen" data-group="kitchen">Кухня</a><a href="?section=tea" data-group="tea">Китайский чай</a><a href="?section=drinks" data-group="drinks">Напитки</a><a href="?section=desserts" data-group="desserts">Десерты</a>
        </nav>
      </div>
    </div>
    <div class="wrap catalog-body">
      <aside class="section-index" aria-label="Подразделы меню" hidden>
        <label for="jump-select">Подраздел</label>
        <select id="jump-select"><option value="">Выбрать подраздел</option></select>
        <nav id="section-links" aria-label="Подразделы меню"></nav>

      <div class="catalog-content">
        <p class="menu-status" role="status" aria-live="polite">Загружаем меню…</p>

      <div class="actions"><a class="button button-amber" href="tel:+78512298686">Позвонить</a><a class="button button-outline" href="https://2gis.ru/astrakhan/directions/points/%7C48.033896%2C46.354485%3B70000001048365224" target="_blank" rel="noopener">Маршрут в 2ГИС</a></div>
    </div>
  </footer>
  <dialog id="dish-dialog" aria-labelledby="dish-title">

      <form method="dialog"><button class="close-dialog" aria-label="Закрыть карточку" autofocus>×</button></form>
      <div id="dish-picture"></div>
      <div class="dish-copy">
        <p class="kicker" id="dish-category"></p>
        <h2 id="dish-title"></h2>
        <p id="dish-description"></p>
        <p id="dish-portion"></p>
        <p id="dish-price"></p>

    </div>
